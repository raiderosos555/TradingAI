[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-briefing"
version = "0.2.0"
description = "Local MT5 trading system with deterministic strategies and independent risk gate"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1; platform_system == 'Windows'"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]

[project.scripts]
trading-ai = "trading_ai.cli:main"

[tool.setuptools.packages.find]
include = ["trading_ai*"]
